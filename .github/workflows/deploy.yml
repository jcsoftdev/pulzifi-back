name: CI / Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go tests
        run: go test ./...

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend deps
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: TypeScript type check
        working-directory: frontend
        run: bun run type-check

  changes:
    name: Detect changes
    needs: test
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      scraper: ${{ steps.filter.outputs.scraper }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed paths
        id: filter
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "$CHANGED"

          go_changed=false
          scraper_changed=false
          frontend_changed=false

          while IFS= read -r file; do
            if echo "$file" | grep -qE '^(cmd/|modules/|shared/|go\.mod|go\.sum|Dockerfile\.(api|worker))'; then
              go_changed=true
            fi
            if echo "$file" | grep -qE '^modules/infra/scraper/'; then
              scraper_changed=true
            fi
            if echo "$file" | grep -qE '^frontend/'; then
              frontend_changed=true
            fi
          done <<< "$CHANGED"

          echo "go=$go_changed" >> $GITHUB_OUTPUT
          echo "scraper=$scraper_changed" >> $GITHUB_OUTPUT
          echo "frontend=$frontend_changed" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Deploy API
        if: needs.changes.outputs.go == 'true'
        run: |
          curl -fsSL -X POST \
            -H "Content-Type: application/json" \
            -H "x-github-event: push" \
            -d '{"ref":"refs/heads/main"}' \
            "${{ secrets.DOKPLOY_WEBHOOK_API }}"

      - name: Deploy Worker
        if: needs.changes.outputs.go == 'true'
        run: |
          curl -fsSL -X POST \
            -H "Content-Type: application/json" \
            -H "x-github-event: push" \
            -d '{"ref":"refs/heads/main"}' \
            "${{ secrets.DOKPLOY_WEBHOOK_WORKER }}"

      - name: Deploy Scraper
        if: needs.changes.outputs.scraper == 'true'
        run: |
          curl -fsSL -X POST \
            -H "Content-Type: application/json" \
            -H "x-github-event: push" \
            -d '{"ref":"refs/heads/main"}' \
            "${{ secrets.DOKPLOY_WEBHOOK_SCRAPER }}"

      - name: Deploy Frontend
        if: needs.changes.outputs.frontend == 'true'
        run: |
          curl -fsSL -X POST \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"applicationId":"zpdIvGkIjfY-C6PKNbTO4"}' \
            "http://45.8.132.213:3000/api/application.deploy"
