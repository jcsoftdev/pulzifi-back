# Override: connect monolith and worker to the production DB instead of local postgres.
# Usage: make dev-with-prod
services:
  monolith:
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432
    depends_on:
      postgres: null
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      scraper:
        condition: service_healthy

  worker:
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432
    depends_on:
      postgres: null
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      scraper:
        condition: service_healthy
