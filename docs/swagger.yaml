          CheckIntervalMinutes, when non-nil, updates the check cadence.
          Must be one of the allowed presets (720, 1440). Minimum cadence is 12h.
        type: integer
      is_active:
        description: |-
          IsActive, when non-nil, enables or disables the profile in the scheduler.
          Setting to false sets next_check_at=nil; setting to true resets next_check_at=now().
        type: boolean
    type: object
  updateprofile.Response:
    properties:
      avatar_url:
        type: string
      check_interval_minutes:
        type: integer
      consecutive_failures:
        type: integer
      created_at:
        type: string
      display_name:
        type: string
      handle:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      last_checked_at:
        type: string
      next_check_at:
        type: string
      platform:
        type: string
      updated_at:
        type: string
      workspace_id:
        type: string
    type: object
