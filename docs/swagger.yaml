host: localhost:3000
info:
  contact:
    email: support@pulzifi.com
    name: API Support
  description: Pulzifi backend monolith API
  license:
    name: MIT
  title: Pulzifi API
  version: "1.0"
paths:
  /alerts:
    get:
      description: List all alerts for the current workspace
      parameters:
      - description: Workspace ID (optional filter)
        in: query
        name: workspace_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List Alerts
      tags:
      - alerts
    post:
      consumes:
      - application/json
      description: Create a new alert
      parameters:
      - description: Create Alert Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/createalert.CreateAlertRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/createalert.CreateAlertResponse'
      security:
      - BearerAuth: []
      summary: Create Alert
      tags:
      - alerts
  /alerts/{id}:
    delete:
      description: Delete an alert
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete Alert
      tags:
      - alerts
    get:
      description: Get an alert by ID
      parameters:
      - description: Alert ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get Alert
      tags:
      - alerts
    put:
      description: Mark an alert as read
      parameters:
      - description: Alert ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Mark Alert as Read
      tags:
      - alerts
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with email and password. Returns access_token for
        use with the Authorize button above.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/login.Request'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/login.Response'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login
      tags:
      - auth
  /auth/logout:
    post:
      description: Revoke the refresh token and clear authentication cookies
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logout
      tags:
      - auth
  /auth/me:
    get:
      description: Get the profile of the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Submit a new user registration request (requires admin approval)
      parameters:
      - description: Registration Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/register.Request'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register
      tags:
      - auth
  /insights:
    get:
      description: List all insights
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List Insights
      tags:
      - insights
  /insights/{id}:
    get:
      description: Get an insight by ID
      parameters:
      - description: Insight ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get Insight
      tags:
      - insights
  /insights/generate:
    post:
      consumes:
      - application/json
      description: Generate insights for a page check using its HTML content
      parameters:
      - description: Generate Insight Request
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/listinsights.ListInsightsResponse'
      security:
      - BearerAuth: []
      summary: Generate Insight
      tags:
      - insights
  /monitoring/checks:
    get:
      description: List monitoring checks filtered by page_id
      parameters:
      - description: Page ID
        in: query
        name: page_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/listchecks.ListChecksResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List Monitoring Checks
      tags:
      - monitoring
    post:
      consumes:
      - application/json
      description: Create a new monitoring check
      parameters:
      - description: Create Check Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/createcheck.CreateCheckRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/createcheck.CreateCheckResponse'
      security:
      - BearerAuth: []
      summary: Create Monitoring Check
      tags:
      - monitoring
  /monitoring/checks/{id}:
    get:
      description: Get a monitoring check by ID
      parameters:
      - description: Check ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get Monitoring Check
      tags:
      - monitoring
  /monitoring/checks/page/{pageId}:
    get:
      description: List monitoring checks for a specific page
      parameters:
      - description: Page ID
        in: path
        name: pageId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/listchecks.ListChecksResponse'
      security:
      - BearerAuth: []
      summary: List Monitoring Checks By Page
      tags:
      - monitoring
  /monitoring/checks/page/{pageId}/run:
    post:
      description: Trigger an immediate monitoring check for a page
      parameters:
      - description: Page ID
        in: path
        name: pageId
        required: true
        type: string
      responses:
        "202":
          description: Accepted
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "402":
          description: Payment Required
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Run Check Now
      tags:
      - monitoring
  /monitoring/configs:
    post:
      consumes:
      - application/json
      description: Create a new monitoring config
      parameters:
      - description: Create Config Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/create_monitoring_config.CreateMonitoringConfigRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/create_monitoring_config.CreateMonitoringConfigResponse'
      security:
      - BearerAuth: []
      summary: Create Monitoring Config
      tags:
      - monitoring
  /monitoring/configs/{pageId}:
    get:
      description: Get a monitoring config by page ID
      parameters:
      - description: Page ID
        in: path
        name: pageId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get Monitoring Config
      tags:
      - monitoring
    put:
      consumes:
      - application/json
      description: Update an existing monitoring config or create a new one if it
        doesn't exist
      parameters:
      - description: Page ID
        in: path
        name: pageId
