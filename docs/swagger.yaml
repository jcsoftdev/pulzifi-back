        type: string
      to:
        type: string
    type: object
  entities.ChangeSummary:
    properties:
      avatar_changed:
        description: AvatarChanged is true when the stored avatar URL differs.
        type: boolean
      bio:
        allOf:
        - $ref: '#/definitions/entities.TextDiff'
        description: Bio holds before/after text when ChangeTypeBioChanged is present.
      display_name:
        allOf:
        - $ref: '#/definitions/entities.TextDiff'
        description: DisplayName holds before/after text when ChangeTypeDisplayNameChanged
          is present.
      edited_captions:
        description: EditedCaptions maps ExternalID → TextDiff for posts whose caption
          changed.
        items:
          $ref: '#/definitions/entities.CaptionDiff'
        type: array
      followers_delta:
        description: |-
          FollowersDelta is set when ChangeTypeFollowersChanged is present.
          Positive = gained followers, negative = lost followers.
        type: integer
      new_posts:
        description: NewPosts contains the ExternalIDs of posts added since the previous
          snapshot.
        items:
          type: string
        type: array
      removed_posts:
        description: RemovedPosts contains the ExternalIDs of posts removed since
          the previous snapshot.
        items:
          type: string
        type: array
    type: object
  entities.Metadata:
    additionalProperties: true
    type: object
  entities.Post:
    properties:
      caption:
        description: Caption is the post text / description.
        type: string
      comments_count:
        description: CommentsCount is the number of comments at capture time.
        type: integer
      external_id:
        description: ExternalID is the platform-native post identifier (used for deduplication).
        type: string
      likes_count:
        description: LikesCount is the number of likes at capture time.
        type: integer
      media_url:
        description: MediaURL is the CDN URL of the post thumbnail (expires; do not
          persist).
        type: string
      posted_at:
        description: PostedAt is the time the post was published on the platform.
        type: string
      stored_media_url:
        description: |-
          StoredMediaURL is the object-storage URL (MinIO/Cloudinary) written by
          MediaStore.Store. Persisted alongside the snapshot.
        type: string
    type: object
  entities.ProfileData:
    properties:
      avatar_url:
        description: |-
          AvatarURL is the stored (MinIO/Cloudinary) URL of the profile picture.
          CDN URLs expire; the infrastructure layer downloads and re-uploads them.
        type: string
      bio:
        description: Bio is the profile biography / description text.
        type: string
      display_name:
        description: DisplayName is the human-readable name shown on the profile.
        type: string
      followers_count:
        description: FollowersCount is the number of followers at capture time.
        type: integer
      following_count:
        description: FollowingCount is the number of accounts the profile follows.
        type: integer
      posts:
        description: Posts contains the most recent posts (capped by SOCIAL_POSTS_PER_CHECK).
        items:
          $ref: '#/definitions/entities.Post'
        type: array
      posts_count:
        description: PostsCount is the total number of posts reported by the platform.
        type: integer
    type: object
