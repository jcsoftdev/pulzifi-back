# Docker Compose — Local Development Only
# Prod uses Dokploy (self-hosted VPS). This file is dev-only.

networks:
  pulzifi-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

services:

  postgres:
    image: postgres:17-alpine
    container_name: pulzifi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pulzifi}
      POSTGRES_USER: ${DB_USER:-pulzifi_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pulzifi_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database_setup.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./shared/database/migrations:/docker-entrypoint-initdb.d/migrations:ro
    networks:
      - pulzifi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pulzifi_user} -d ${DB_NAME:-pulzifi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pulzifi-redis
    restart: unless-stopped
    ports:
      - "${DEV_REDIS_PORT:-6381}:6379"
    volumes:
      - redis-data:/data
    networks:
      - pulzifi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.0
    container_name: pulzifi-localstack
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      - SERVICES=s3
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - pulzifi-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  scraper:
    build:
      context: ./modules/infra/scraper
      dockerfile: Dockerfile
    container_name: pulzifi-scraper
    restart: unless-stopped
    shm_size: '1gb'
    ports:
      - "${SCRAPER_PORT:-3005}:3000"
    environment:
      PORT: 3000
      MAX_CONCURRENT_PAGES: 3
      NAV_TIMEOUT_MS: 30000
      CF_MAX_WAIT_MS: 20000
      SCREENSHOT_QUALITY: 80
    volumes:
      - ./modules/infra/scraper/index.ts:/app/index.ts
      - ./modules/infra/scraper/src:/app/src
    command: ["bun", "run", "--watch", "index.ts"]
    networks:
      - pulzifi-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  monolith:
    build:
      context: .
      dockerfile: Dockerfile.monolith.all-in-one
    image: pulzifi-monolith:latest
    container_name: pulzifi-monolith
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      scraper:
        condition: service_healthy
    environment:
      HTTP_PORT: 3000
      NEXTJS_URL: http://host.docker.internal:${DEV_WEB_PORT:-3001}
      ENVIRONMENT: development
      ENABLE_WORKERS: "false"
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: localstack:4566
      MINIO_ACCESS_KEY: test
      MINIO_SECRET_KEY: test
      MINIO_BUCKET: ${MINIO_BUCKET:-pulzifi-snapshots}
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_URL: http://localhost:${LOCALSTACK_PORT:-4566}
      EXTRACTOR_URL: http://scraper:3000
    env_file:
      - .env
    ports:
      - "${HTTP_PORT:-3000}:3000"
    volumes:
      - .:/workspace
    networks:
      - pulzifi-network
    command: air -c .air.api.toml
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.monolith.all-in-one
    image: pulzifi-monolith:latest
    container_name: pulzifi-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      scraper:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      ENABLE_WORKERS: "true"
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: localstack:4566
      MINIO_ACCESS_KEY: test
      MINIO_SECRET_KEY: test
      MINIO_BUCKET: ${MINIO_BUCKET:-pulzifi-snapshots}
      MINIO_USE_SSL: "false"
      EXTRACTOR_URL: http://scraper:3000
    env_file:
      - .env
    volumes:
      - .:/workspace
    networks:
      - pulzifi-network
    command: air -c .air.worker.toml
